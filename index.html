<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khám Phá Quà Tặng Bất Ngờ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        h1 {
            color: #ffffff;
            margin-bottom: 20px;
            font-size: 2rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .start-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            background: #ff4757;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            transition: all 0.3s ease;
        }

        .start-btn:hover {
            transform: scale(1.05);
            background: #ff6b81;
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.6);
        }

        /* Phần hiển thị hù dọa (Mặc định ẩn) */
        #scare-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        #scare-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Hiệu ứng rung lắc cực mạnh */
            animation: shake 0.1s infinite, flash 0.05s infinite;
        }

        /* Hiệu ứng chớp nháy và rung */
        @keyframes shake {
            0% { transform: translate(0, 0) scale(1.1); }
            20% { transform: translate(-10px, 10px) scale(1.2); }
            40% { transform: translate(10px, -10px) scale(1.1); }
            60% { transform: translate(-15px, -5px) scale(1.25); }
            80% { transform: translate(15px, 5px) scale(1.15); }
            100% { transform: translate(0, 0) scale(1.1); }
        }

        @keyframes flash {
            0% { filter: brightness(1) contract(1); }
            50% { filter: brightness(2) contrast(1.5); }
            100% { filter: brightness(0.8) contrast(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Nhấn vào nút bên dưới để nhận bất ngờ! 🎁</h1>
        <button class="start-btn" onclick="triggerScare()">MỞ QUÀ NGAY</button>
    </div>

    <!-- Màn hình Doạ Ma -->
    <div id="scare-screen">
        <img id="scare-image" src="https://images.unsplash.com/photo-1509248961158-e54f6934749c?q=80&w=1000&auto=format&fit=crop" alt="Scary Clown">
    </div>

    <!-- Âm thanh Tiếng Hét / Cười Ma Mị -->
    <audio id="scare-sound" preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2560/2560-preview.mp3" type="audio/mpeg">
    </audio>

    <script>
        function triggerScare() {
            // Mở chế độ toàn màn hình nếu trình duyệt hỗ trợ
            let elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(() => {});
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            }

            // Hiển thị hình ảnh hù dọa
            document.getElementById('scare-screen').style.display = 'flex';

            // Phát âm thanh tiếng hét lớn
            let sound = document.getElementById('scare-sound');
            sound.volume = 1.0; // Âm lượng tối đa
            sound.play().catch(error => {
                console.log("Lỗi phát âm thanh: ", error);
            });
        }
    </script>
</body>
</html>
